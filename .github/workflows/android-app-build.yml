name: Android App Build

on:
  workflow_dispatch:
  push:
    branches:
      - storage-migration/neon-r2
    paths:
      - package.json
      - capacitor.config.json
      - public/**
      - .github/workflows/android-app-build.yml

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm install
      - name: Add Android native project
        run: npx cap add android
      - name: Sync native app
        run: npx cap sync android
      - name: Build Android test and release packages
        run: cd android && ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: mavhola-parish-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload Android release APK and AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: mavhola-parish-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
