name: Validate website

on:
  pull_request:
    branches: [storage-migration/neon-r2]
  push:
    branches: [feature/parish-online-shop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check public/app.js
      - run: node --check server.neon.js
      - run: node --check shop-router.js
      - run: npm test
