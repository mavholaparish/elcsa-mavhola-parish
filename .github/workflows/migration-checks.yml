name: Migration checks
on:
  push:
    branches:
      - storage-migration/neon-r2
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Commit dependency lockfile
        run: |
          if [ -f package-lock.json ]; then
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Add reproducible dependency lockfile'
              git push
            fi
          fi
      - run: node --check server.neon.js
      - run: node --check database.js
      - run: node --check storage.js
      - run: node --check upload-validation.js
      - run: npm test
      - name: Report dependency vulnerabilities
        if: always()
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{title:x.title,url:x.url,range:x.range})}))},null,2))'
